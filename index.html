<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>U(3) / SU(3) Explorer</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#18283e;margin:0;padding:24px}main{max-width:1050px;margin:auto}h1{font-size:30px}h2{font-size:18px}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:20px;margin:16px 0}.layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.control{display:grid;grid-template-columns:65px 1fr 60px;gap:8px;align-items:center;margin:12px 0}input{width:100%;accent-color:#146c94}button,select{padding:9px 12px;border:1px solid #b8c8d8;border-radius:6px;background:white;color:inherit;margin:4px}button{cursor:pointer}.matrix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.cell{padding:12px 3px;text-align:center;border-radius:6px;font:12px monospace;overflow-wrap:anywhere}.amp{font-size:12px;color:#52667b}svg{width:100%;max-width:550px;display:block;margin:auto}.metrics{font-family:monospace;overflow-wrap:anywhere}small{color:#52667b}@media(max-width:760px){.layout{grid-template-columns:1fr}body{padding:12px}}
</style>
<main><h1>三阶幺正矩阵探索器</h1><p>U = D U₂₃ U₁₃ U₁₂ · 反厄米生成元的三角函数参数化</p>
<section><label>矩阵群 <select id="group"><option>U(3)</option><option>SU(3)</option></select></label><button id="random">随机参数</button><button id="reset">单位矩阵</button><button id="copy">复制矩阵 JSON</button><small id="status"></small></section>
<div class="layout"><section><h2>参数（度）</h2><div id="controls"></div><small>SU(3) 中 α₃ = −α₁ − α₂，保证 det U = 1。随机参数不是 Haar 均匀采样。</small></section>
<div><section><h2>复数矩阵 U</h2><div class="matrix" id="matrix"></div><h2>模方 |Uᵢⱼ|²</h2><div class="matrix" id="heat"></div><small>每行及每列的模方之和均为 1；颜色越深，模方越大。</small></section>
<section><h2>复平面可视化</h2><svg id="plot" viewBox="0 0 330 330" role="img" aria-label="九个矩阵元素的复平面向量"></svg><small>每格对应一个矩阵元素；横轴 Re，纵轴 Im，箭头长度为模长，方向为相位。</small></section>
<section><h2>数值验证</h2><div class="metrics" id="metrics"></div><h2>U†U</h2><div class="matrix" id="gram"></div></section></div></div></main>
<script src="unitary.js"></script><script>
const keys=['t12','t13','t23','f12','f13','f23','a1','a2','a3'], names=['θ₁₂','θ₁₃','θ₂₃','φ₁₂','φ₁₃','φ₂₃','α₁','α₂','α₃'];
const $=id=>document.getElementById(id), controls={};let latest;
keys.forEach((k,i)=>{const row=document.createElement('label');row.className='control';row.innerHTML='<span>'+names[i]+'</span><input type="range" min="0" max="'+(i<3?90:360)+'" step="1" value="0"><output>0°</output>'; $('controls').append(row);controls[k]=row.querySelector('input');controls[k].oninput=render;});
const fmt=([r,i])=>r.toFixed(4)+(i<0?' − ':' + ')+Math.abs(i).toFixed(4)+'i';
function cells(id,M,heat=false){$(id).replaceChildren();M.flat().forEach(v=>{const el=document.createElement('div');el.className='cell';const q=v[0]**2+v[1]**2;el.textContent=heat?q.toFixed(4):fmt(v);el.style.background=heat?'rgba(20,108,148,'+(.08+.8*q)+')':'#edf3f8';if(heat&&q>.55)el.style.color='white';$(id).append(el);});}
function render(){const special=$('group').value==='SU(3)';controls.a3.disabled=special;const p={};keys.forEach(k=>{p[k]=Number(controls[k].value)*Math.PI/180;controls[k].nextElementSibling.value=controls[k].value+'°';});latest=unitary3(p,special);if(special)controls.a3.nextElementSibling.value=(-Number(controls.a1.value)-Number(controls.a2.value))+'°';const {U,gram,err,det}=latest;cells('matrix',U);cells('heat',U,true);cells('gram',gram);$('metrics').textContent='det U = '+fmt(det)+' | max |U†U − I| = '+err.toExponential(3);
let svg='<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#146c94"/></marker></defs>';
U.forEach((row,i)=>row.forEach(([r,s],j)=>{const x=55+110*j,y=52+110*i;svg+='<g><circle cx="'+x+'" cy="'+y+'" r="39" fill="none" stroke="#cbd5e1"/><path d="M'+(x-44)+' '+y+'h88 M'+x+' '+(y-44)+'v88" stroke="#cbd5e1"/><text x="'+(x-44)+'" y="'+(y-43)+'" font-size="10">U'+(i+1)+(j+1)+'</text><line x1="'+x+'" y1="'+y+'" x2="'+(x+39*r)+'" y2="'+(y-39*s)+'" stroke="#146c94" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="'+(x+39*r)+'" cy="'+(y-39*s)+'" r="2" fill="#146c94"/></g>'; }));$('plot').innerHTML=svg;}
$('group').onchange=render;$('reset').onclick=()=>{keys.forEach(k=>controls[k].value=0);render();};$('random').onclick=()=>{keys.forEach((k,i)=>controls[k].value=Math.floor(Math.random()*(i<3?91:361)));render();};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(latest.U));$('status').textContent='已复制（每个元素为 [实部, 虚部]）';}catch(e){$('status').textContent='浏览器未允许剪贴板访问';}};render();
</script></html>
